<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Küme Topolojisi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animated dashed stroke on SVG connection lines to suggest WAL flow
           direction from leader -> replica. */
        @keyframes wal-flow {
            to { stroke-dashoffset: -24; }
        }
        .wal-line {
            stroke-dasharray: 8 4;
            animation: wal-flow 1.2s linear infinite;
        }
        /* Subtle skeleton pulse for first-load placeholders. */
        @keyframes sk-pulse {
            0%, 100% { opacity: 0.55; }
            50%      { opacity: 0.85; }
        }
        .skeleton { animation: sk-pulse 1.4s ease-in-out infinite; }
    </style>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased" style="font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;">

    <!-- Top navigation bar -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-gray-950/80 backdrop-blur border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-7xl 2xl:max-w-[96rem] min-[1800px]:max-w-[120rem] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between gap-4">
                <a href="/" class="flex items-center gap-2.5 shrink-0">
                    <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-700 text-white shadow-sm ring-1 ring-indigo-600/20">
                        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.657 4.03 3 9 3s9-1.343 9-3V5"/><path d="M3 12c0 1.657 4.03 3 9 3s9-1.343 9-3"/></svg>
                    </span>
                    <span class="text-sm font-bold tracking-tight text-gray-900 dark:text-white">PGCluster<span class="text-indigo-600 dark:text-indigo-400">Manager</span></span>
                </a>

                <nav class="flex items-center gap-1 overflow-x-auto">
                    <a href="/" class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white whitespace-nowrap transition-colors">
                        Durum
                    </a>
                    <div class="px-3 py-1.5 rounded-md bg-indigo-600 text-white text-sm font-semibold shadow-sm whitespace-nowrap">
                        Topoloji
                    </div>
                    <a href="/query-analytics" class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white whitespace-nowrap transition-colors">
                        Sorgu Analizi
                    </a>
                    <a href="/query" class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white whitespace-nowrap transition-colors">
                        Aktif Sorgular
                    </a>
                    <a href="/users" class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white whitespace-nowrap transition-colors">
                        Kullanıcılar
                    </a>
                </nav>

                <div class="flex items-center gap-1 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-1 shadow-sm">
                    <button id="refreshBtn" onclick="fetchTopology(true)" title="Şimdi Yenile" aria-label="Şimdi Yenile" class="rounded-md p-1.5 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </button>
                    <button onclick="toggleDarkMode()" title="Temayı değiştir" aria-label="Temayı değiştir" class="rounded-md p-1.5 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white transition-colors">
                        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl 2xl:max-w-[96rem] min-[1800px]:max-w-[120rem] mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Hero header -->
        <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
            <div>
                <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.18em] text-indigo-600 dark:text-indigo-400">
                    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><line x1="6.5" y1="6.5" x2="10" y2="10"/><line x1="17.5" y1="6.5" x2="14" y2="10"/><line x1="6.5" y1="17.5" x2="10" y2="14"/><line x1="17.5" y1="17.5" x2="14" y2="14"/></svg>
                    Replikasyon Grafiği
                </div>
                <h1 class="mt-2 text-3xl sm:text-4xl font-bold tracking-tight text-gray-900 dark:text-white">Küme Topolojisi</h1>
                <p class="mt-1.5 text-sm text-gray-500 dark:text-gray-400">Canlı Patroni küme üyeleri, rolleri ve replikasyon gecikmesi.</p>
            </div>
            <div class="flex items-center gap-2 text-xs">
                <span class="inline-flex items-center gap-1.5 rounded-full bg-gray-100 dark:bg-gray-800 px-2.5 py-1 font-medium text-gray-600 dark:text-gray-300">
                    <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span id="lastUpdated" style="font-family: 'JetBrains Mono', ui-monospace, monospace;">Yükleniyor&hellip;</span>
                </span>
            </div>
        </div>

        <!-- Stale / error banner (hidden by default). -->
        <div id="staleBanner" class="hidden rounded-xl ring-1 ring-amber-300 dark:ring-amber-700/60 bg-amber-50 dark:bg-amber-950/50 text-amber-800 dark:text-amber-200 px-4 py-3 text-sm">
            <span id="staleMessage">Topoloji yenilenemedi. Son bilinen veriler gösteriliyor.</span>
        </div>

        <section id="clusterContainer" class="space-y-8">
            <!-- Initial skeleton. Replaced on first successful fetch. -->
            <section class="skeleton rounded-xl shadow-sm ring-1 ring-gray-200 dark:ring-gray-800 bg-white dark:bg-gray-900 p-6">
                <div class="h-6 w-64 bg-gray-200 dark:bg-gray-800 rounded mb-4"></div>
                <div class="h-40 bg-gray-100 dark:bg-gray-900/50 rounded"></div>
            </section>
        </section>
    </main>

    <script>
        // Tailwind config
        tailwind.config = { darkMode: 'class' };
        document.documentElement.classList.toggle('dark', localStorage.getItem('darkMode') === 'true');

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
            // Redraw connection lines since stroke colors may change.
            drawAllLines();
        }

        // Escape HTML special chars so user-supplied strings (hostnames, member
        // names from Patroni config) cannot inject markup.
        function escHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function formatBytes(n) {
            n = Number(n) || 0;
            const neg = n < 0;
            n = Math.abs(n);
            let out;
            if (n < 1024) out = `${n} B`;
            else if (n < 1024 ** 2) out = `${(n / 1024).toFixed(1)} KB`;
            else if (n < 1024 ** 3) out = `${(n / 1024 ** 2).toFixed(1)} MB`;
            else out = `${(n / 1024 ** 3).toFixed(2)} GB`;
            return neg ? `-${out}` : out;
        }

        function lagColorClass(bytes) {
            if (bytes < 1_000_000) return 'text-green-600 dark:text-green-400';
            if (bytes < 10_000_000) return 'text-amber-600 dark:text-amber-400';
            return 'text-red-600 dark:text-red-400';
        }

        // SVG stroke color (hex) for connection lines, matching lag severity.
        function lagStrokeColor(bytes) {
            if (bytes < 1_000_000) return '#16a34a';   // green-600
            if (bytes < 10_000_000) return '#d97706';  // amber-600
            return '#dc2626';                          // red-600
        }

        function roleBadge(role, sync) {
            // Role label priority: explicit sync_state from pg_stat_replication
            // wins, because Patroni sometimes still labels a sync node as "replica".
            let label, cls;
            if (role === 'leader') {
                label = 'LİDER';
                cls = 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200';
            } else if (role === 'standby_leader') {
                label = 'YEDEK LİDER';
                cls = 'bg-indigo-100 text-indigo-800 dark:bg-indigo-900 dark:text-indigo-200';
            } else if (sync === 'sync' || sync === 'quorum' || role === 'sync_standby') {
                label = sync === 'quorum' ? 'QUORUM YEDEK' : 'SENKRON YEDEK';
                cls = 'bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200';
            } else {
                label = 'ASENKRON REPLİKA';
                cls = 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200';
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold ${cls}">${escHtml(label)}</span>`;
        }

        function stateBadge(state) {
            if (!state) return '';
            const s = String(state).toLowerCase();
            let cls = 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200';
            if (s === 'running' || s === 'streaming') {
                cls = 'bg-green-50 text-green-700 dark:bg-green-900/50 dark:text-green-300';
            } else if (s === 'starting' || s === 'catchup') {
                cls = 'bg-amber-50 text-amber-700 dark:bg-amber-900/50 dark:text-amber-300';
            } else if (s === 'stopped' || s === 'crashed') {
                cls = 'bg-red-50 text-red-700 dark:bg-red-900/50 dark:text-red-300';
            }
            const labels = {
                'running': 'çalışıyor',
                'streaming': 'akış halinde',
                'starting': 'başlatılıyor',
                'catchup': 'yakalanıyor',
                'stopped': 'durduruldu',
                'crashed': 'çöktü'
            };
            const display = labels[s] || s;
            return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${cls}">${escHtml(display)}</span>`;
        }

        // Build the leader card HTML. Highlighted with a pulsing green dot.
        function renderLeaderCard(leader) {
            if (!leader) {
                return `<div class="flex-1 min-w-[16rem] rounded-xl shadow-sm ring-1 ring-amber-300 dark:ring-amber-700 bg-amber-50 dark:bg-amber-950 p-5 text-amber-800 dark:text-amber-200 text-sm">
                    Patroni tarafından lider bildirilmedi.
                </div>`;
            }
            return `
                <div data-node-id="${escHtml(leader.name)}" data-node-role="leader"
                     class="leader-card relative flex-1 min-w-[18rem] rounded-xl shadow-md ring-2 ring-green-400 dark:ring-green-600 bg-white dark:bg-gray-800 p-5">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center space-x-3">
                            <span class="relative flex h-3 w-3">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                            </span>
                            <div class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Birincil</div>
                        </div>
                        ${roleBadge('leader', '')}
                    </div>
                    <div class="text-lg font-bold text-gray-900 dark:text-white">${escHtml(leader.name)}</div>
                    <div class="mt-1 text-sm font-mono text-gray-600 dark:text-gray-300">${escHtml(leader.host)}:${escHtml(leader.port)}</div>
                    <div class="mt-3 flex items-center space-x-2 text-xs">
                        ${stateBadge(leader.state)}
                        <span class="text-gray-500 dark:text-gray-400">zaman çizelgesi <span class="font-mono text-gray-800 dark:text-gray-200">${escHtml(leader.timeline ?? 0)}</span></span>
                    </div>
                </div>
            `;
        }

        // Build a replica card HTML.
        function renderReplicaCard(rep) {
            const lagBytes = Number(rep.lag_bytes || 0);
            const lagSecs = Number(rep.lag_seconds || 0);
            const lagCls = lagColorClass(lagBytes);
            return `
                <div data-node-id="${escHtml(rep.name)}" data-node-role="replica"
                     class="replica-card relative rounded-xl shadow-sm ring-1 ring-gray-200 dark:ring-gray-700 bg-white dark:bg-gray-800 p-5">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center space-x-2">
                            <span class="inline-block h-2.5 w-2.5 rounded-full bg-gray-400 dark:bg-gray-500"></span>
                            <div class="text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Replika</div>
                        </div>
                        ${roleBadge(rep.role, rep.sync_state)}
                    </div>
                    <div class="text-base font-semibold text-gray-900 dark:text-white">${escHtml(rep.name)}</div>
                    <div class="mt-1 text-sm font-mono text-gray-600 dark:text-gray-300">${escHtml(rep.host)}:${escHtml(rep.port)}</div>
                    <div class="mt-3 flex flex-wrap items-center gap-2 text-xs">
                        ${stateBadge(rep.state)}
                        <span class="text-gray-500 dark:text-gray-400">zaman çizelgesi <span class="font-mono text-gray-800 dark:text-gray-200">${escHtml(rep.timeline ?? 0)}</span></span>
                    </div>
                    <div class="mt-4 grid grid-cols-2 gap-3 text-sm">
                        <div>
                            <div class="text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400">Gecikme (bayt)</div>
                            <div class="mt-0.5 font-mono font-semibold ${lagCls}">${formatBytes(lagBytes)}</div>
                        </div>
                        <div>
                            <div class="text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400">Gecikme (süre)</div>
                            <div class="mt-0.5 font-mono font-semibold ${lagCls}">${lagSecs}sn</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Build an entire cluster card (header + leader + replicas + SVG overlay).
        function renderClusterCard(server) {
            if (server.error) {
                return `
                    <section class="rounded-xl shadow-sm ring-1 ring-gray-200 dark:ring-gray-700 bg-white dark:bg-gray-800 p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-xl font-semibold text-gray-900 dark:text-white">${escHtml(server.name)}</h2>
                        </div>
                        <div class="rounded-lg ring-1 ring-red-300 dark:ring-red-700 bg-red-50 dark:bg-red-950 text-red-800 dark:text-red-200 px-4 py-3 text-sm">
                            <div class="font-semibold mb-1">Küme keşfedilemedi</div>
                            <div class="font-mono text-xs break-all">${escHtml(server.error)}</div>
                        </div>
                    </section>
                `;
            }

            const members = Array.isArray(server.members) ? server.members : [];
            const leader = members.find(m => m.role === 'leader')
                        || members.find(m => m.name === server.leader)
                        || null;
            const replicas = members.filter(m => m !== leader);

            // Sort: sync first, then async, then by name.
            replicas.sort((a, b) => {
                const rank = r => (r.sync_state === 'sync' ? 0 : r.sync_state === 'quorum' ? 1 : 2);
                const d = rank(a) - rank(b);
                return d !== 0 ? d : String(a.name).localeCompare(String(b.name));
            });

            const timeline = leader ? (leader.timeline ?? 0) : 0;

            const replicaHTML = replicas.length
                ? replicas.map(renderReplicaCard).join('')
                : `<div class="rounded-xl ring-1 ring-dashed ring-gray-300 dark:ring-gray-600 bg-gray-50 dark:bg-gray-900 p-5 text-sm text-gray-500 dark:text-gray-400">Hiç replika bildirilmedi.</div>`;

            return `
                <section data-cluster="${escHtml(server.name)}" class="cluster-card relative rounded-xl shadow-sm ring-1 ring-gray-200 dark:ring-gray-700 bg-white dark:bg-gray-800 p-6 overflow-hidden">
                    <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
                        <h2 class="text-xl font-semibold text-gray-900 dark:text-white">${escHtml(server.name)}</h2>
                        <div class="flex flex-wrap items-center gap-2 text-xs">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-md bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200">
                                lider: <span class="ml-1 font-mono">${escHtml(server.leader || '—')}</span>
                            </span>
                            <span class="inline-flex items-center px-2.5 py-1 rounded-md bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200">
                                zaman çizelgesi: <span class="ml-1 font-mono">${escHtml(timeline)}</span>
                            </span>
                            <span class="inline-flex items-center px-2.5 py-1 rounded-md bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200">
                                ${members.length} düğüm
                            </span>
                        </div>
                    </header>

                    <div class="relative">
                        <!-- SVG overlay for connection lines. Absolute-positioned, pointer-events disabled. -->
                        <svg class="connections-svg absolute inset-0 w-full h-full pointer-events-none" aria-hidden="true"></svg>

                        <div class="relative flex flex-col lg:flex-row gap-6 lg:gap-16 items-stretch">
                            <div class="lg:w-2/5 flex">
                                ${renderLeaderCard(leader)}
                            </div>
                            <div class="lg:w-3/5 grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${replicaHTML}
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        // Compute & draw SVG connection lines from the leader card center-right
        // to each replica card center-left, inside a single cluster card.
        function drawClusterLines(section) {
            const svg = section.querySelector('.connections-svg');
            if (!svg) return;
            const leaderEl = section.querySelector('.leader-card');
            const replicas = section.querySelectorAll('.replica-card');
            if (!leaderEl || replicas.length === 0) {
                svg.innerHTML = '';
                return;
            }

            // The svg is inside .relative wrapper around the flex row. Use that
            // wrapper as the coordinate origin so getBoundingClientRect math is
            // stable regardless of page scroll.
            const wrapper = svg.parentElement;
            const wrapRect = wrapper.getBoundingClientRect();
            const w = Math.max(1, wrapRect.width);
            const h = Math.max(1, wrapRect.height);
            svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
            svg.setAttribute('width', w);
            svg.setAttribute('height', h);

            const lRect = leaderEl.getBoundingClientRect();
            const lx = lRect.right - wrapRect.left;
            const ly = lRect.top + lRect.height / 2 - wrapRect.top;

            const parts = [];
            replicas.forEach(rep => {
                const rRect = rep.getBoundingClientRect();
                const rx = rRect.left - wrapRect.left;
                const ry = rRect.top + rRect.height / 2 - wrapRect.top;

                // Read lag from the rendered node attributes (walked out of data-).
                // We instead look it up via the original dataset on the card.
                const lagBytes = Number(rep.dataset.lagBytes || 0);
                const stroke = lagStrokeColor(lagBytes);
                const label = rep.dataset.lagLabel || '';

                // Cubic Bezier with horizontal control points for a gentle S-curve.
                const dx = Math.max(40, (rx - lx) * 0.5);
                const d = `M ${lx} ${ly} C ${lx + dx} ${ly}, ${rx - dx} ${ry}, ${rx} ${ry}`;

                parts.push(`<path d="${d}" fill="none" stroke="${stroke}" stroke-width="2.5" class="wal-line" stroke-linecap="round"></path>`);

                // Label roughly at the curve midpoint.
                const midX = (lx + rx) / 2;
                const midY = (ly + ry) / 2 - 8;
                if (label) {
                    parts.push(`
                        <g>
                            <rect x="${midX - 34}" y="${midY - 11}" width="68" height="18" rx="9" ry="9"
                                  fill="currentColor" class="text-white dark:text-gray-900" opacity="0.85"></rect>
                            <text x="${midX}" y="${midY + 2}" text-anchor="middle"
                                  font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
                                  font-size="11" font-weight="600" fill="${stroke}">${label}</text>
                        </g>
                    `);
                }
            });

            svg.innerHTML = parts.join('');
        }

        function drawAllLines() {
            document.querySelectorAll('.cluster-card').forEach(drawClusterLines);
        }

        // Re-render everything from the topology response.
        let lastGeneratedAt = 0;
        function renderTopology(data) {
            const container = document.getElementById('clusterContainer');
            const servers = (data && data.servers) || [];
            lastGeneratedAt = Number(data && data.generated_at) || Math.floor(Date.now() / 1000);

            if (servers.length === 0) {
                container.innerHTML = `
                    <section class="rounded-xl shadow-sm ring-1 ring-gray-200 dark:ring-gray-700 bg-white dark:bg-gray-800 p-10 text-center">
                        <div class="text-gray-500 dark:text-gray-400">Yapılandırılmış küme yok.</div>
                    </section>
                `;
                return;
            }

            container.innerHTML = servers.map(renderClusterCard).join('');

            // After innerHTML swap, attach lag dataset to replica cards for line
            // drawing (we want to avoid re-parsing the HTML string).
            servers.forEach(s => {
                if (s.error) return;
                const section = container.querySelector(`section[data-cluster="${cssEscape(s.name)}"]`);
                if (!section) return;
                (s.members || []).forEach(m => {
                    if (m.role === 'leader') return;
                    const card = section.querySelector(`.replica-card[data-node-id="${cssEscape(m.name)}"]`);
                    if (!card) return;
                    card.dataset.lagBytes = String(m.lag_bytes || 0);
                    const bytes = Number(m.lag_bytes || 0);
                    card.dataset.lagLabel = formatBytes(bytes);
                });
            });

            drawAllLines();
        }

        // CSS.escape polyfill-ish for attribute selectors.
        function cssEscape(s) {
            if (window.CSS && CSS.escape) return CSS.escape(String(s));
            return String(s).replace(/["\\]/g, '\\$&');
        }

        // Fetch + render with error handling. If `force` is true, clear the
        // stale banner on success regardless.
        async function fetchTopology(force) {
            const banner = document.getElementById('staleBanner');
            try {
                const resp = await fetch('/api/v1/topology', { cache: 'no-store' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                renderTopology(data);
                banner.classList.add('hidden');
                updateLastUpdatedLabel();
            } catch (err) {
                console.error('Topology fetch failed:', err);
                document.getElementById('staleMessage').textContent =
                    `Topoloji yenilenemedi (${err.message || err}). Son bilinen veriler gösteriliyor.`;
                banner.classList.remove('hidden');
            }
        }

        function updateLastUpdatedLabel() {
            const el = document.getElementById('lastUpdated');
            if (!lastGeneratedAt) {
                el.textContent = 'Yükleniyor\u2026';
                return;
            }
            const diff = Math.max(0, Math.floor(Date.now() / 1000) - lastGeneratedAt);
            let text;
            if (diff < 2) text = 'Az önce güncellendi';
            else if (diff < 60) text = `${diff}sn önce güncellendi`;
            else if (diff < 3600) text = `${Math.floor(diff / 60)}dk önce güncellendi`;
            else text = `${Math.floor(diff / 3600)}sa önce güncellendi`;
            el.textContent = text;
        }

        // Redraw on resize (debounced via requestAnimationFrame).
        let resizeRAF = 0;
        function onResize() {
            if (resizeRAF) cancelAnimationFrame(resizeRAF);
            resizeRAF = requestAnimationFrame(() => { resizeRAF = 0; drawAllLines(); });
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchTopology(true);
            setInterval(fetchTopology, 5000);
            setInterval(updateLastUpdatedLabel, 1000);
            window.addEventListener('resize', onResize);

            // ResizeObserver on the container catches cases where card sizes
            // change without a window resize (e.g. content-driven reflow).
            if (window.ResizeObserver) {
                const ro = new ResizeObserver(onResize);
                ro.observe(document.getElementById('clusterContainer'));
            }
        });
    </script>
</body>
</html>
