<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parola · MonoDB Manager</title>
    <link rel="preload" href="/static/fonts/manrope-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/app.css">
    {{template "sidebar-head"}}
</head>
<body class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased">
<div class="flex min-h-screen">
    {{template "sidebar" (dict "Page" "settings-password" "Auth" .Auth)}}
    <div class="main-wrapper flex-1 lg:ml-64 min-w-0 flex flex-col">
        <main id="main" class="flex-1 w-full px-4 sm:px-6 lg:px-8 py-6 lg:py-8 space-y-8">
            <div class="flex items-start gap-3">
                <button onclick="toggleSidebar()" class="lg:hidden mt-1 rounded-md p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 shrink-0" aria-label="Menü">
                    <svg class="w-5 h-5" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div>
                    <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-gray-900 dark:text-white">Parola Değiştir</h1>
                    <p class="mt-1.5 text-sm text-gray-500 dark:text-gray-400">{{.Auth.Username}} hesabınız için yeni bir parola belirleyin.</p>
                </div>
            </div>

            <div id="message" class="hidden rounded-md px-3 py-2 text-sm ring-1 ring-inset"></div>

            <section class="max-w-lg bg-white dark:bg-gray-900 rounded-xl shadow-sm ring-1 ring-gray-200 dark:ring-gray-800 overflow-hidden">
                <form id="passwordForm" class="p-6 space-y-5">
                    <div>
                        <label for="currentPassword" class="block text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">Mevcut parola</label>
                        <input id="currentPassword" type="password" required autocomplete="current-password" class="block w-full rounded-md border-0 ring-1 ring-inset ring-gray-300 dark:ring-gray-700 bg-white dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-inset focus:ring-indigo-500 px-3.5 py-2.5 text-sm">
                    </div>
                    <div>
                        <label for="newPassword" class="block text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">Yeni parola <span class="normal-case font-medium text-gray-400 dark:text-gray-500">(en az 12 karakter)</span></label>
                        <input id="newPassword" type="password" required minlength="12" autocomplete="new-password" class="block w-full rounded-md border-0 ring-1 ring-inset ring-gray-300 dark:ring-gray-700 bg-white dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-inset focus:ring-indigo-500 px-3.5 py-2.5 text-sm">
                    </div>
                    <div>
                        <label for="confirmPassword" class="block text-xs font-semibold uppercase tracking-wider text-gray-600 dark:text-gray-400 mb-1.5">Yeni parola (tekrar)</label>
                        <input id="confirmPassword" type="password" required minlength="12" autocomplete="new-password" class="block w-full rounded-md border-0 ring-1 ring-inset ring-gray-300 dark:ring-gray-700 bg-white dark:bg-gray-800 dark:text-white focus:ring-2 focus:ring-inset focus:ring-indigo-500 px-3.5 py-2.5 text-sm">
                    </div>
                    <button type="submit" class="inline-flex justify-center rounded-md bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 transition-colors">Parolayı Güncelle</button>
                </form>
            </section>
        </main>
    </div>
</div>

<script>
    function show(kind, text) {
        const box = document.getElementById('message');
        box.textContent = text;
        box.className = 'rounded-md px-3 py-2 text-sm ring-1 ring-inset ' + (kind === 'ok'
            ? 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-200 ring-emerald-200 dark:ring-emerald-800'
            : 'bg-red-50 dark:bg-red-950/50 text-red-800 dark:text-red-200 ring-red-200 dark:ring-red-800');
    }

    document.getElementById('passwordForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const current = document.getElementById('currentPassword').value;
        const next = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        if (next !== confirm) {
            show('err', 'Yeni parolalar eşleşmiyor.');
            return;
        }
        try {
            const response = await fetch('/api/v1/auth/password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ current_password: current, new_password: next })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
            show('ok', data.message || 'Parola güncellendi.');
            setTimeout(() => { window.location.href = '/login'; }, 1200);
        } catch (err) {
            show('err', err.message);
        }
    });
</script>
</body>
</html>
