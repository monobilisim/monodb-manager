<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL Query Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Query Analytics</h1>
            <div class="flex items-center space-x-6">
                <button onclick="toggleDarkMode()" class="rounded-lg p-2.5 hover:bg-gray-200 dark:hover:bg-gray-700">
                    <!-- Sun icon -->
                    <svg class="w-6 h-6 hidden dark:block text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <!-- Moon icon -->
                    <svg class="w-6 h-6 block dark:hidden text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
                <a href="/" class="px-4 py-2.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300">
                    Status
                </a>
                <div class="px-4 py-2.5 rounded-md bg-indigo-100 dark:bg-indigo-900 text-indigo-800 dark:text-indigo-200 font-medium">
                    Query Analytics
                </div>
                <a href="/query" class="px-4 py-2.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300">
                    Active Queries
                </a>
                <a href="/users" class="px-4 py-2.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300">
                    Users
                </a>
            </div>
        </div>

        {{if .PMMQanURL}}
        <div class="mb-8 bg-white dark:bg-gray-800 shadow rounded-lg overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Query Performance Monitoring</h2>
                <div class="flex items-center space-x-2">
                    <button onclick="adjustIframeHeight('queryAnalyticsIframe', 150)" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                    <button onclick="adjustIframeHeight('queryAnalyticsIframe', -150)" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
                        </svg>
                    </button>
                    <button onclick="toggleFullscreen('queryAnalyticsIframe')" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 4h-4m4 0l-5-5" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="w-full iframe-container">
                <iframe
                    id="queryAnalyticsIframe"
                    src="{{.PMMQanURL}}"
                    class="w-full border-0 resize-y"
                    style="min-height: 600px; height: 600px;"
                    allow="fullscreen">
                </iframe>
                <div class="resize-handle" onmousedown="initResize('queryAnalyticsIframe', event)"></div>
            </div>
        </div>
        {{else}}
        <div class="bg-white dark:bg-gray-800 shadow rounded-lg p-8 text-center">
            <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">Query Analytics Not Configured</h2>
            <p class="text-gray-600 dark:text-gray-400">
                The query analytics dashboard has not been configured. 
                Please add a "query_iframe" URL to your configuration file.
            </p>
        </div>
        {{end}}
    </div>

    <script>
        // Tailwind config
        tailwind.config = {
            darkMode: 'class'
        }

        // Check for dark mode preference on load
        document.documentElement.classList.toggle('dark', localStorage.getItem('darkMode') === 'true');

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark);
        }
        
        // Function to adjust iframe height by the specified amount
        function adjustIframeHeight(iframeId, change) {
            const iframe = document.getElementById(iframeId);
            if (iframe) {
                const currentHeight = parseInt(iframe.style.height);
                const newHeight = Math.max(200, currentHeight + change); // Minimum height of 200px
                iframe.style.height = newHeight + 'px';
            }
        }
        
        // Function to toggle fullscreen for an iframe
        function toggleFullscreen(iframeId) {
            const iframe = document.getElementById(iframeId);
            if (iframe) {
                if (!document.fullscreenElement) {
                    if (iframe.requestFullscreen) {
                        iframe.requestFullscreen();
                    } else if (iframe.webkitRequestFullscreen) { /* Safari */
                        iframe.webkitRequestFullscreen();
                    } else if (iframe.msRequestFullscreen) { /* IE11 */
                        iframe.msRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) { /* Safari */
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) { /* IE11 */
                        document.msExitFullscreen();
                    }
                }
            }
        }
        
        // Initial iframe resize event setup
        let resizeTarget = null;
        let initialY = 0;
        let initialHeight = 0;
        
        // Function to initialize resize
        function initResize(iframeId, event) {
            resizeTarget = document.getElementById(iframeId);
            if (resizeTarget) {
                initialY = event.clientY;
                initialHeight = parseInt(resizeTarget.style.height);
                
                // Add event listeners for resize
                document.addEventListener('mousemove', doResize);
                document.addEventListener('mouseup', stopResize);
            }
            event.preventDefault();
        }
        
        // Function to perform resize
        function doResize(event) {
            if (resizeTarget) {
                const dy = event.clientY - initialY;
                const newHeight = Math.max(200, initialHeight + dy);
                resizeTarget.style.height = newHeight + 'px';
            }
        }
        
        // Function to stop resize
        function stopResize() {
            resizeTarget = null;
            document.removeEventListener('mousemove', doResize);
            document.removeEventListener('mouseup', stopResize);
        }
    </script>
    
    <style>
        /* Add this to the end of your file or in head */
        .iframe-container {
            position: relative;
        }
        
        .resize-handle {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background-color: transparent;
            cursor: ns-resize;
        }
        
        .resize-handle:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }
        
        .resize-y {
            resize: vertical;
        }
    </style>
</body>
</html>
